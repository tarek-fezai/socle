# Éphémère : prouve qu'un fichier realm s'importe avec la même image / commande
# que deploy/compose (start --import-realm). REALM_FILE = chemin absolu du JSON.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.0}
    command: ["start", "--import-realm", "--http-enabled=true", "--hostname-strict=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_VERIFY_PORT:-18081}:8080"
    volumes:
      # DEV UNIQUEMENT — ne jamais importer en production.
      # Forme longue : évite le parse « C:/… » comme host:container sous Docker Desktop.
      - type: bind
        source: ${REALM_FILE}
        target: /opt/keycloak/data/import/realm.json
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
