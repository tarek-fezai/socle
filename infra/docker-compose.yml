services:
  postgres:
    image: postgres:16
    container_name: socle-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socle}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socle}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: socle-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-socle}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-socle}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realm-socle.dev.json:/opt/keycloak/data/import/realm-socle.dev.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: socle-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-socle}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-socle}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: socle-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8088}:8080"
    depends_on:
      - temporal

  openfga-migrate:
    image: openfga/openfga:v1.8.4
    container_name: socle-openfga-migrate
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-socle}:${POSTGRES_PASSWORD:-socle}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  openfga:
    image: openfga/openfga:v1.8.4
    container_name: socle-openfga
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-socle}:${POSTGRES_PASSWORD:-socle}@postgres:5432/openfga?sslmode=disable
      OPENFGA_HTTP_ADDR: 0.0.0.0:8080
      OPENFGA_GRPC_ADDR: 0.0.0.0:8081
      OPENFGA_PLAYGROUND_ENABLED: "true"
    ports:
      - "${OPENFGA_HTTP_PORT:-8082}:8080"
      - "${OPENFGA_GRPC_PORT:-8083}:8081"
      - "${OPENFGA_PLAYGROUND_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully

  minio:
    # Note: minio/minio Hub pulls may be blocked on some networks; adobe/s3mock is S3-compatible for local dev.
    image: adobe/s3mock:latest
    container_name: socle-minio
    environment:
      initialBuckets: ${S3_BUCKET:-socle-docs}
      rootAccessKey: ${S3_ACCESS_KEY:-socleminio}
      rootSecretKey: ${S3_SECRET_KEY:-socleminio}
    ports:
      - "${MINIO_API_PORT:-9000}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: socle-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
