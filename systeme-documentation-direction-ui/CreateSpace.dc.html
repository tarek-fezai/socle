<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouvel espace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
  body { margin: 0; font-family: 'IBM Plex Sans', sans-serif; background: #FFFFFF; color: #0E0E10; }
  a { text-decoration: none; }
  .serif { font-family: 'Instrument Serif', serif; }
  .cta:hover { background: #2C27C7; }
  .ghost:hover { background: #F5F5F7; }
  .field:focus-within { border-color: #C7C6F5; }
  .swatch:hover { transform: scale(1.08); }
  .vis:hover { border-color: #C7C6F5; }
</style>
</helmet>

<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; background: #FFFFFF; overflow: hidden;">

  <!-- DIMMED BACKGROUND -->
  <div style="position: absolute; inset: 0; padding: 0 48px;">
    <div style="height: 60px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ECECEE; opacity: 0.35;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <div style="width: 22px; height: 22px; border-radius: 6px; background: #3730E0;"></div>
        <div style="font-size: 14.5px; font-weight: 700;">Socle</div>
      </div>
      <div style="width: 130px; height: 32px; border-radius: 7px; background: #3730E0;"></div>
    </div>
    <div style="margin-top: 44px; opacity: 0.3;">
      <div style="height: 34px; width: 280px; background: #F1EFEA; border-radius: 6px; margin-bottom: 32px;"></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; max-width: 900px;">
        <div style="height: 150px; border-radius: 14px; background: #F1EFEA;"></div>
        <div style="height: 150px; border-radius: 14px; background: #F1EFEA;"></div>
        <div style="height: 150px; border-radius: 14px; background: #F1EFEA;"></div>
      </div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(14,14,16,0.45);"></div>

  <!-- MODAL -->
  <div style="position: absolute; top: 120px; left: 50%; transform: translateX(-50%); width: 480px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 24px 60px rgba(14,14,16,0.28); padding: 30px 30px 26px; box-sizing: border-box;">

    <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px;">
      <h1 class="serif" style="font-weight: 400; font-size: 24px; margin: 0; color: #0E0E10;">Créer un espace</h1>
      <a href="Spaces.dc.html" aria-label="Fermer" class="ghost" style="width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B6B72" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </a>
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 12px; font-weight: 600; color: #9B9BA1; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">Nom de l'espace</label>
      <div class="field" style="border: 1px solid #ECECEE; border-radius: 9px; padding: 11px 13px;">
        <span style="font-size: 14.5px; color: #C2C2C6;">Ex. Sécurité &amp; SOC</span>
      </div>
    </div>

    <div style="margin-bottom: 18px;">
      <label style="display: block; font-size: 12px; font-weight: 600; color: #9B9BA1; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">Description</label>
      <div class="field" style="border: 1px solid #ECECEE; border-radius: 9px; padding: 11px 13px;">
        <span style="font-size: 13.5px; color: #C2C2C6;">De quoi cet espace regroupe-t-il la documentation ?</span>
      </div>
    </div>

    <label style="display: block; font-size: 12px; font-weight: 600; color: #9B9BA1; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;">Couleur</label>
    <div style="display: flex; gap: 12px; margin-bottom: 20px;">
      <div class="swatch" style="width: 28px; height: 28px; border-radius: 8px; background: #3730E0; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #3730E0; cursor: pointer;"></div>
      <div class="swatch" style="width: 28px; height: 28px; border-radius: 8px; background: #0D8A7C; cursor: pointer;"></div>
      <div class="swatch" style="width: 28px; height: 28px; border-radius: 8px; background: #B7791F; cursor: pointer;"></div>
      <div class="swatch" style="width: 28px; height: 28px; border-radius: 8px; background: #7C3AED; cursor: pointer;"></div>
      <div class="swatch" style="width: 28px; height: 28px; border-radius: 8px; background: #1E8E5A; cursor: pointer;"></div>
      <div class="swatch" style="width: 28px; height: 28px; border-radius: 8px; background: #B54708; cursor: pointer;"></div>
    </div>

    <label style="display: block; font-size: 12px; font-weight: 600; color: #9B9BA1; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;">Visibilité par défaut</label>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 26px;">
      <div class="vis" style="display: flex; align-items: center; gap: 10px; padding: 10px 13px; border: 1.5px solid #3730E0; background: #FAFAFE; border-radius: 9px; cursor: pointer;">
        <div style="width: 14px; height: 14px; border-radius: 50%; border: 4.5px solid #3730E0; flex-shrink: 0;"></div>
        <span style="font-size: 13.5px; font-weight: 500; color: #0E0E10;">Organisation entière</span>
      </div>
      <div class="vis" style="display: flex; align-items: center; gap: 10px; padding: 10px 13px; border: 1px solid #ECECEE; border-radius: 9px; cursor: pointer;">
        <div style="width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #C7C6C6; flex-shrink: 0;"></div>
        <span style="font-size: 13.5px; font-weight: 500; color: #0E0E10;">Membres invités uniquement</span>
      </div>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 10px;">
      <a href="Spaces.dc.html" class="ghost" style="padding: 9px 16px; border-radius: 7px; border: 1px solid #ECECEE; color: #43434A; font-size: 13px; font-weight: 500;">Annuler</a>
      <a href="SpaceSettings.dc.html" class="cta" style="padding: 9px 20px; border-radius: 7px; background: #3730E0; color: #FFFFFF; font-size: 13px; font-weight: 600;">Créer l'espace</a>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
