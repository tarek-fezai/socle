# SPDX-License-Identifier: LicenseRef-Socle-Proprietary
#
# Publish multi-arch container images on version tags (v*).
#
# Image mirroring (air-gapped / private registry clients):
#   VERSION=1.2.3  # semver without leading v
#   for img in socle-backend socle-frontend socle-worker; do
#     crane copy "ghcr.io/tarek-fezai/${img}:${VERSION}" "registry.example.com/socle/${img}:${VERSION}"
#   done
# Or: skopeo copy docker://ghcr.io/tarek-fezai/socle-backend:${VERSION} docker://registry.example.com/socle/socle-backend:${VERSION}
# Pin by digest after mirroring: ghcr.io/tarek-fezai/socle-backend@sha256:...
#
# Note : les images GHCR sont publiques par défaut ; leur visibilité se règle manuellement
# dans GitHub Packages (Packages → Package settings → Change visibility).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: tarek-fezai

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: socle-backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            image: socle-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: worker
            image: socle-worker
            context: webhook-worker
            dockerfile: webhook-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.licenses=LicenseRef-Socle-Proprietary
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: false

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-${{ matrix.image }}-${{ github.ref_name }}.spdx.json
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}-${{ github.ref_name }}
          path: sbom-${{ matrix.image }}.spdx.json

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}@${DIGEST}"

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*-${{ github.ref_name }}
          merge-multiple: true
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
