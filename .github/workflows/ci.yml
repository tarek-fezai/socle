name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: mvn -B verify
      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        shell: bash
        run: set -o pipefail && pnpm test 2>&1 | tee vitest-output.txt
      - name: Build
        run: pnpm build
      - name: Upload Vitest / build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-output
          path: |
            frontend/vitest-output.txt
            frontend/coverage/
            frontend/test-results/
          if-no-files-found: ignore

  worker:
    name: worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webhook-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: webhook-worker/go.sum
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  authz-model:
    name: authz-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenFGA CLI
        env:
          FGA_CLI_VERSION: "0.8.1"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/fga.tar.gz \
            "https://github.com/openfga/cli/releases/download/v${FGA_CLI_VERSION}/fga_${FGA_CLI_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/fga.tar.gz -C /tmp
          sudo mv /tmp/fga /usr/local/bin/fga
          fga version
      - name: Test authorization model
        run: fga model test --tests infra/openfga/model.fga.yaml

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [backend, frontend, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            e2e_relevant:
              - 'deploy/**'
              - '**/Dockerfile'
              - 'frontend/nginx.conf'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
              - 'e2e/**'

      - name: Skip when paths do not match (PR/push only)
        if: |
          github.event_name != 'schedule' &&
          steps.changes.outputs.e2e_relevant != 'true'
        run: echo "E2E skipped — no deploy/Dockerfile/release/e2e changes."

      - name: E2E stack and Playwright
        if: |
          github.event_name == 'schedule' ||
          steps.changes.outputs.e2e_relevant == 'true'
        env:
          BASE_URL: http://127.0.0.1
          KEYCLOAK_BASE_URL: http://127.0.0.1:8081
          E2E_RUN_BACKUP: "1"
          POSTGRES_USER: socle
          COMPOSE_PROJECT_NAME: socle-production
        run: |
          set -euo pipefail
          chmod +x e2e/scripts/*.sh
          bash e2e/scripts/generate-ci-env.sh deploy/compose/.env.ci
          # Demo IdP: keycloak DB is already in init-databases.sql
          cd deploy/compose
          docker compose -f docker-compose.yml -f ../../e2e/docker-compose.e2e.yml \
            --env-file .env.ci --profile demo-idp up -d --build
          cd ../..
          bash e2e/scripts/wait-stack.sh .env.ci
          cd e2e
          npm install
          npx playwright install chromium --with-deps
          npm test
        timeout-minutes: 45

      - name: Dump Compose logs on failure
        if: failure()
        working-directory: deploy/compose
        run: |
          docker compose -f docker-compose.yml -f ../../e2e/docker-compose.e2e.yml \
            --env-file .env.ci --profile demo-idp ps -a || true
          docker compose -f docker-compose.yml -f ../../e2e/docker-compose.e2e.yml \
            --env-file .env.ci --profile demo-idp logs --no-color --tail=200 \
            backend openfga openfga-init temporal keycloak caddy || true

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down Compose
        if: always() && (github.event_name == 'schedule' || steps.changes.outputs.e2e_relevant == 'true')
        run: |
          cd deploy/compose
          docker compose -f docker-compose.yml -f ../../e2e/docker-compose.e2e.yml \
            --env-file .env.ci --profile demo-idp down -v --remove-orphans || true
