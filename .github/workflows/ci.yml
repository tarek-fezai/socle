name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: mvn -B verify
      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        shell: bash
        run: set -o pipefail && pnpm test 2>&1 | tee vitest-output.txt
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: Visual login comparison
        shell: bash
        run: set -o pipefail && pnpm test:visual 2>&1 | tee playwright-visual.txt
      - name: Upload Vitest / visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-output
          path: |
            frontend/vitest-output.txt
            frontend/playwright-visual.txt
            frontend/coverage/
            frontend/test-results/
            frontend/e2e-visual/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Export OpenAPI (springdoc)
        working-directory: backend
        run: mvn -B -Popenapi-export test
      - name: Generate TypeScript types
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm gen:api
      - name: Fail if OpenAPI or api-types drifted
        run: |
          set -euo pipefail
          git diff --exit-code -- openapi/openapi.json frontend/src/lib/api-types.ts

  worker:
    name: worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webhook-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: webhook-worker/go.sum
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  authz-model:
    name: authz-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenFGA CLI
        env:
          FGA_CLI_VERSION: "0.8.1"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/fga.tar.gz \
            "https://github.com/openfga/cli/releases/download/v${FGA_CLI_VERSION}/fga_${FGA_CLI_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/fga.tar.gz -C /tmp
          sudo mv /tmp/fga /usr/local/bin/fga
          fga version
      - name: Test authorization model
        run: fga model test --tests infra/openfga/model.fga.yaml

  # Catch unknown JSON keys (ex. "_comment") that break Keycloak --import-realm.
  # e2e mounts e2e/realm-socle.ci.json only — this job covers every realm file.
  keycloak-realms:
    name: keycloak-realms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Keycloak realm import
        env:
          KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.0
          KEYCLOAK_VERIFY_LOG_DIR: ${{ runner.temp }}/keycloak-realm-logs
          KEYCLOAK_VERIFY_TIMEOUT_SEC: "300"
        run: |
          set -euo pipefail
          chmod +x infra/keycloak/verify-realm-import.sh
          bash infra/keycloak/verify-realm-import.sh
      - name: Upload Keycloak import logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-realm-import-logs
          path: ${{ runner.temp }}/keycloak-realm-logs/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [backend, frontend, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            e2e_relevant:
              - 'deploy/**'
              - '**/Dockerfile'
              - 'frontend/nginx.conf'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
              - 'e2e/**'
              - 'infra/keycloak/**'

      - name: Skip when paths do not match (PR/push only)
        if: |
          github.event_name != 'schedule' &&
          steps.changes.outputs.e2e_relevant != 'true'
        run: echo "E2E skipped — no deploy/Dockerfile/release/e2e changes."

      - name: E2E stack and Playwright
        if: |
          github.event_name == 'schedule' ||
          steps.changes.outputs.e2e_relevant == 'true'
        env:
          BASE_URL: http://127.0.0.1
          KEYCLOAK_BASE_URL: http://127.0.0.1:8081
          E2E_RUN_BACKUP: "1"
          POSTGRES_USER: socle
          COMPOSE_PROJECT_NAME: socle-production
        run: |
          set -euo pipefail
          chmod +x e2e/scripts/*.sh
          bash e2e/scripts/generate-ci-env.sh deploy/compose/.env.ci
          # Demo IdP: keycloak DB is already in init-databases.sql
          cd deploy/compose
          docker compose -f docker-compose.yml -f ../../e2e/docker-compose.e2e.yml \
            --env-file .env.ci --profile demo-idp up -d --build
          cd ../..
          bash e2e/scripts/wait-stack.sh .env.ci
          # Preuve : image e2e embarque la clé de TEST (build-arg), pas celle du dépôt
          REPO_KEY="$(tr -d '\n\r ' < backend/src/main/resources/licence/ed25519-public.b64)"
          CI_KEY="$(tr -d '\n\r ' < e2e/.ci-licence-keys/public.b64)"
          test -n "$CI_KEY"
          test "$REPO_KEY" != "$CI_KEY"
          BACKEND_CID="$(cd deploy/compose && docker compose -f docker-compose.yml -f ../../e2e/docker-compose.e2e.yml --env-file .env.ci --profile demo-idp ps -q backend)"
          bash e2e/scripts/verify-embedded-licence-key.sh "$BACKEND_CID" e2e/.ci-licence-keys/public.b64
          bash e2e/scripts/import-ci-licence.sh .env.ci
          cd e2e
          npm install
          npx playwright install chromium --with-deps
          npm test
        timeout-minutes: 45

      - name: Dump Compose logs on failure
        if: failure()
        working-directory: deploy/compose
        run: |
          docker compose -f docker-compose.yml -f ../../e2e/docker-compose.e2e.yml \
            --env-file .env.ci --profile demo-idp ps -a || true
          docker compose -f docker-compose.yml -f ../../e2e/docker-compose.e2e.yml \
            --env-file .env.ci --profile demo-idp logs --no-color --tail=200 \
            backend openfga openfga-init temporal keycloak caddy || true

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down Compose
        if: always() && (github.event_name == 'schedule' || steps.changes.outputs.e2e_relevant == 'true')
        run: |
          cd deploy/compose
          docker compose -f docker-compose.yml -f ../../e2e/docker-compose.e2e.yml \
            --env-file .env.ci --profile demo-idp down -v --remove-orphans || true

  helm:
    name: helm
    runs-on: ubuntu-latest
    needs: [backend, frontend, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            helm_relevant:
              - 'deploy/helm/**'
              - '**/Dockerfile'
              - '.github/workflows/ci.yml'

      - name: Skip when paths do not match (PR/push only)
        if: |
          github.event_name != 'schedule' &&
          steps.changes.outputs.helm_relevant != 'true'
        run: echo "Helm job skipped — no chart/Dockerfile changes."

      - name: Install Helm
        if: github.event_name == 'schedule' || steps.changes.outputs.helm_relevant == 'true'
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm lint
        if: github.event_name == 'schedule' || steps.changes.outputs.helm_relevant == 'true'
        run: helm lint deploy/helm/socle

      - name: helm template must fail when git + replicas>1
        if: github.event_name == 'schedule' || steps.changes.outputs.helm_relevant == 'true'
        run: |
          set -euo pipefail
          if helm template socle deploy/helm/socle \
            --set storage.provider=git \
            --set backend.replicas=2 \
            --set idp.issuerUri=http://example/realms/x \
            --set secrets.postgresPassword=TestPass1! \
            --set secrets.oidcClientSecret=TestOidc1! \
            --set secrets.patPepper=ci-helm-pat-pepper-not-a-secret-0123456789 \
            --set postgres.host=pg.example \
            >/tmp/helm-out.yaml 2>/tmp/helm-err.txt; then
            echo "expected helm template to fail for git + replicas=2" >&2
            cat /tmp/helm-out.yaml >&2 || true
            exit 1
          fi
          grep -qi 'backend.replicas=1\|replicas=1\|JVM file lock' /tmp/helm-err.txt
          echo "OK: helm template failed as expected"
          cat /tmp/helm-err.txt

      - name: helm template must fail when blob local + replicas>1
        if: github.event_name == 'schedule' || steps.changes.outputs.helm_relevant == 'true'
        run: |
          set -euo pipefail
          if helm template socle deploy/helm/socle \
            --set storage.provider=relational \
            --set blob.provider=local \
            --set backend.replicas=2 \
            --set idp.issuerUri=http://example/realms/x \
            --set secrets.postgresPassword=TestPass1! \
            --set secrets.oidcClientSecret=TestOidc1! \
            --set secrets.patPepper=ci-helm-pat-pepper-not-a-secret-0123456789 \
            --set postgres.host=pg.example \
            >/tmp/helm-blob-out.yaml 2>/tmp/helm-blob-err.txt; then
            echo "expected helm template to fail for blob.local + replicas=2" >&2
            cat /tmp/helm-blob-out.yaml >&2 || true
            exit 1
          fi
          grep -qi 'blob.provider=local\|local disk is not shared\|replicas=1' /tmp/helm-blob-err.txt
          echo "OK: helm template failed as expected for blob local"
          cat /tmp/helm-blob-err.txt

      - name: Create kind cluster
        if: github.event_name == 'schedule' || steps.changes.outputs.helm_relevant == 'true'
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: socle
          wait: 120s

      - name: Build images and load into kind
        if: github.event_name == 'schedule' || steps.changes.outputs.helm_relevant == 'true'
        run: |
          set -euo pipefail
          docker build -t socle-backend:kind ./backend
          docker build -t socle-frontend:kind ./frontend
          docker build -t socle-worker:kind ./webhook-worker
          kind load docker-image socle-backend:kind socle-frontend:kind socle-worker:kind --name socle
          docker image inspect socle-backend:kind --format 'backend size={{.Size}}'

      - name: Helm install on kind
        if: github.event_name == 'schedule' || steps.changes.outputs.helm_relevant == 'true'
        run: |
          set -euo pipefail
          helm upgrade --install socle deploy/helm/socle \
            --namespace socle --create-namespace \
            -f deploy/helm/socle/ci/kind-values.yaml \
            --wait --timeout 15m

      - name: Wait for pods Ready and actuator UP
        if: github.event_name == 'schedule' || steps.changes.outputs.helm_relevant == 'true'
        run: |
          set -euo pipefail
          kubectl -n socle wait --for=condition=Ready pod --all --timeout=600s
          kubectl -n socle port-forward svc/socle-backend 18080:8080 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            body="$(curl -sf http://127.0.0.1:18080/actuator/health || true)"
            if echo "$body" | grep -q '"status":"UP"'; then
              echo "actuator health UP: $body"
              exit 0
            fi
            sleep 5
          done
          echo "actuator never became UP" >&2
          exit 1

      - name: Dump pod logs on failure
        if: failure() && (github.event_name == 'schedule' || steps.changes.outputs.helm_relevant == 'true')
        run: |
          kubectl -n socle get pods -o wide || true
          kubectl -n socle describe pods || true
          for p in $(kubectl -n socle get pods -o name 2>/dev/null); do
            echo "===== LOGS $p ====="
            kubectl -n socle logs "$p" --all-containers --tail=200 || true
          done
