# Static SPA only — in production, Caddy (or similar) terminates TLS and proxies
# /api to the backend; this container serves the built frontend assets.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSP: allow OIDC discovery / token / redirect against the client's IdP (http or https).
    # frame-ancestors 'none' + X-Frame-Options DENY keep clickjacking closed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http: https:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
