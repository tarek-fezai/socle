server:
  port: ${SERVER_PORT:8080}
  error:
    # Les raisons métier 4xx passent par ApiExceptionHandler (Problem Detail).
    # Ne jamais exposer message/stack via le ErrorAttributes Spring par défaut.
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: socle-backend
  servlet:
    multipart:
      # Assez large pour les vidéos ; le plafond métier (fichier vs vidéo) est appliqué ensuite.
      max-file-size: ${SOCLE_ATTACHMENT_MAX_VIDEO_MB:200}MB
      max-request-size: ${SOCLE_ATTACHMENT_MAX_VIDEO_MB:200}MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/socle_core}
    username: ${SPRING_DATASOURCE_USERNAME:socle}
    password: ${SPRING_DATASOURCE_PASSWORD:socle}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # V27 seed TipTap JSON uses PostgreSQL $json$…$json$ dollar-quotes; Flyway would
    # otherwise treat `${"type":…}` as a placeholder.
    placeholder-replacement: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/socle}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/socle/protocol/openid-connect/certs}
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:socle-backend}
            client-secret: ${OIDC_CLIENT_SECRET:change-me}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            # Reachable from the backend container (may differ from public JWT iss).
            issuer-uri: ${OIDC_CLIENT_ISSUER_URI:${OIDC_ISSUER_URI:http://localhost:8081/realms/socle}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# OpenAPI / Swagger UI : en prod, désactiver via SOCLE_OPENAPI_ENABLED=false
# ou s'appuyer sur le garde ROLE_administrateur-systeme (SecurityConfig).
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SOCLE_OPENAPI_ENABLED:true}
  swagger-ui:
    path: /ApiDocs.dc.html
    enabled: ${SOCLE_OPENAPI_ENABLED:true}

socle:
  instance:
    # Nom d'affichage de l'instance (jamais hardcodé côté produit).
    display-name: ${SOCLE_INSTANCE_DISPLAY_NAME:Socle}
    # Libellé de résidence des données affiché dans Rétention & conformité (vide = non renseigné).
    data-residence-label: ${SOCLE_DATA_RESIDENCE_LABEL:}
    # URL publique de l'application (liens e-mail, logo absolu). Lecture seule côté admin.
    public-base-url: ${SOCLE_PUBLIC_BASE_URL:}
  storage:
    # Choix d'instance exclusif — obligatoire (pas de défaut silencieux côté code).
    provider: ${SOCLE_STORAGE_PROVIDER:relational}
    git-repository-path: ${SOCLE_STORAGE_GIT_PATH:./data/git-content}
  blob:
    # Binaires (pièces jointes) — provider exclusif local (défaut) ou s3-compatible.
    provider: ${SOCLE_BLOB_PROVIDER:local}
    local:
      dir: ${SOCLE_BLOB_LOCAL_DIR:./data/blobs}
    s3:
      endpoint: ${SOCLE_BLOB_S3_ENDPOINT:}
      region: ${SOCLE_BLOB_S3_REGION:us-east-1}
      bucket: ${SOCLE_BLOB_S3_BUCKET:}
      access-key: ${SOCLE_BLOB_S3_ACCESS_KEY:}
      secret-key: ${SOCLE_BLOB_S3_SECRET_KEY:}
      path-style: ${SOCLE_BLOB_S3_PATH_STYLE:true}
      server-side-encryption: ${SOCLE_BLOB_S3_SSE:true}
  attachment:
    max-mb: ${SOCLE_ATTACHMENT_MAX_MB:25}
    max-video-mb: ${SOCLE_ATTACHMENT_MAX_VIDEO_MB:200}
    orphan-retention-days: ${SOCLE_ATTACHMENT_ORPHAN_RETENTION_DAYS:7}
    # Anti bombe : largeur×hauteur max lues via métadonnées ImageReader avant décodage.
    max-image-pixels: ${SOCLE_ATTACHMENT_MAX_IMAGE_PIXELS:40000000}
    # Types MIME détectés (Tika) — SVG refusé par défaut. WebP via TwelveMonkeys imageio-webp.
    allowed-media-types: ${SOCLE_ATTACHMENT_ALLOWED_TYPES:image/png,image/jpeg,image/webp,image/gif,application/pdf,video/mp4,video/webm,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/plain,text/csv,application/zip}
  link-preview:
    # Désactivé par défaut : carte locale (URL + domaine), aucun appel externe.
    enabled: ${SOCLE_LINK_PREVIEW_ENABLED:false}
    allowed-domains: ${SOCLE_LINK_PREVIEW_ALLOWED_DOMAINS:}
    proxy-url: ${SOCLE_LINK_PREVIEW_PROXY_URL:}
    cache-ttl-hours: ${SOCLE_LINK_PREVIEW_CACHE_TTL_HOURS:168}
    rate-limit-per-minute: ${SOCLE_LINK_PREVIEW_RATE_LIMIT_PER_MINUTE:10}
  temporal:
    target: ${TEMPORAL_TARGET:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
  security:
    # Production / compose : true — refuse change-me, admin, socle, secrets vides.
    reject-weak-secrets: ${SOCLE_REJECT_WEAK_SECRETS:false}
  openfga:
    api-url: ${OPENFGA_API_URL:http://localhost:8082}
    store-id: ${OPENFGA_STORE_ID:}
    authorization-model-id: ${OPENFGA_MODEL_ID:}
    auto-init: ${OPENFGA_AUTO_INIT:false}
    state-dir: ${OPENFGA_STATE_DIR:./data/openfga}
    # Plafond OpenFGA ListObjects (OPENFGA_LIST_OBJECTS_MAX_RESULTS côté serveur, 1000 par défaut).
    # Quand listObjects renvoie exactement cette taille → warning (résultats potentiellement tronqués).
    list-objects-max-results: ${OPENFGA_LIST_OBJECTS_MAX_RESULTS:1000}
    # Taille max d'un BatchCheck (OPENFGA_MAX_CHECKS_PER_BATCH_CHECK) — défaut OpenFGA ~50.
    max-checks-per-batch-check: ${OPENFGA_MAX_CHECKS_PER_BATCH_CHECK:50}
    # Parallélisme borné des lots BatchCheck.
    batch-check-parallelism: ${OPENFGA_BATCH_CHECK_PARALLELISM:4}
    # WARN si un appel filterByDocumentViewer dépasse ce nombre de checks.
    document-check-warn-threshold: ${OPENFGA_DOCUMENT_CHECK_WARN_THRESHOLD:500}
    # Migration visibility-v1 au boot — désactivée par défaut (une seule fois via authz_migrations).
    # Activer explicitement ou POST /api/v1/admin/authz/migrate-visibility.
    visibility-migration-on-startup: ${SOCLE_FGA_VISIBILITY_MIGRATION_ON_STARTUP:false}
  folders:
    max-depth: ${SOCLE_FOLDERS_MAX_DEPTH:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  reliability:
    default-review-cycle-days: ${SOCLE_RELIABILITY_DEFAULT_REVIEW_CYCLE_DAYS:365}
  staleness:
    # Seuil instance (jours) — badge « stale » si dernière écriture de contenu plus ancienne.
    # Fail-fast si ≤ 0 ou > 3650. Pas de seuil par espace dans cette itération.
    threshold-days: ${SOCLE_STALENESS_THRESHOLD_DAYS:90}
  writing-assistant:
    # Seuil (mots) au-delà duquel un paragraphe est signalé « trop long » par l'assistant d'écriture.
    long-paragraph-words: ${SOCLE_WRITING_ASSISTANT_LONG_PARAGRAPH_WORDS:120}
  diff:
    # Plafond de lignes Markdown par version pour la comparaison (Historique) — 413 au-delà.
    max-lines: ${SOCLE_DIFF_MAX_LINES:20000}
  edit-lock:
    heartbeat-seconds: ${SOCLE_EDIT_LOCK_HEARTBEAT_SECONDS:15}
    ttl-seconds: ${SOCLE_EDIT_LOCK_TTL_SECONDS:45}
  identity:
    # Défauts = comportement Keycloak historique (dev example). Voir docs/identity-providers.md.
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/socle}
    subject-claim: sub
    email-claim: email
    name-claim: name
    roles-claim: realm_access.roles
    role-source: ${SOCLE_IDENTITY_ROLE_SOURCE:CLAIMS}
    default-role: CONTRIBUTEUR
    role-mapping:
      contributeur: CONTRIBUTEUR
      auditeur: AUDITEUR
      integrateur: INTEGRATEUR
      administrateur-systeme: ADMINISTRATEUR_SYSTEME
    # Liste vide par défaut (Java). Override env : SOCLE_IDENTITY_BOOTSTRAP_ADMIN_SUBJECTS
    # (subs OIDC séparés par des virgules ; ne pas fixer [] ici — empêche parfois le bind env).
    link-by-verified-email: false
    # Politique d'accès — jamais exposée via auth-config (groupes / domaines = confidentiels).
    access-policy:
      mode: ${SOCLE_ACCESS_POLICY_MODE:jit}   # jit | require-group | provisioned-only
      allowed-groups: []
      groups-claim: groups
      allowed-email-domains: []               # vide = tous les domaines
    passkey-acr-values: ${SOCLE_IDENTITY_PASSKEY_ACR_VALUES:}
    idp-display-name: ${SOCLE_IDENTITY_IDP_DISPLAY_NAME:}
    support-contact: ${SOCLE_IDENTITY_SUPPORT_CONTACT:}
    client-id: ${OIDC_FRONTEND_CLIENT_ID:socle-frontend}
    scopes:
      - openid
      - profile
      - email

logging:
  level:
    root: INFO
    eu.socle: DEBUG
