server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: socle-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/socle_core}
    username: ${SPRING_DATASOURCE_USERNAME:socle}
    password: ${SPRING_DATASOURCE_PASSWORD:socle}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/socle}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/socle/protocol/openid-connect/certs}
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:socle-backend}
            client-secret: ${OIDC_CLIENT_SECRET:change-me}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/socle}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /ApiDocs.dc.html

socle:
  instance:
    # Nom d'affichage de l'instance (jamais hardcodé côté produit).
    display-name: ${SOCLE_INSTANCE_DISPLAY_NAME:Socle}
  storage:
    # Choix d'instance exclusif — obligatoire (pas de défaut silencieux côté code).
    provider: ${SOCLE_STORAGE_PROVIDER:relational}
    git-repository-path: ${SOCLE_STORAGE_GIT_PATH:./data/git-content}
  temporal:
    target: ${TEMPORAL_TARGET:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
  openfga:
    api-url: ${OPENFGA_API_URL:http://localhost:8082}
    store-id: ${OPENFGA_STORE_ID:}
    authorization-model-id: ${OPENFGA_MODEL_ID:}
    # Plafond OpenFGA ListObjects (OPENFGA_LIST_OBJECTS_MAX_RESULTS côté serveur, 1000 par défaut).
    # Quand listObjects renvoie exactement cette taille → warning (résultats potentiellement tronqués).
    list-objects-max-results: ${OPENFGA_LIST_OBJECTS_MAX_RESULTS:1000}
    # Taille max d'un BatchCheck (OPENFGA_MAX_CHECKS_PER_BATCH_CHECK) — défaut OpenFGA ~50.
    max-checks-per-batch-check: ${OPENFGA_MAX_CHECKS_PER_BATCH_CHECK:50}
    # Parallélisme borné des lots BatchCheck.
    batch-check-parallelism: ${OPENFGA_BATCH_CHECK_PARALLELISM:4}
    # WARN si un appel filterByDocumentViewer dépasse ce nombre de checks.
    document-check-warn-threshold: ${OPENFGA_DOCUMENT_CHECK_WARN_THRESHOLD:500}
    # Migration visibility-v1 au boot — désactivée par défaut (une seule fois via authz_migrations).
    # Activer explicitement ou POST /api/v1/admin/authz/migrate-visibility.
    visibility-migration-on-startup: ${SOCLE_FGA_VISIBILITY_MIGRATION_ON_STARTUP:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  reliability:
    default-review-cycle-days: ${SOCLE_RELIABILITY_DEFAULT_REVIEW_CYCLE_DAYS:365}
  staleness:
    # Seuil instance (jours) — badge « stale » si dernière écriture de contenu plus ancienne.
    # Fail-fast si ≤ 0 ou > 3650. Pas de seuil par espace dans cette itération.
    threshold-days: ${SOCLE_STALENESS_THRESHOLD_DAYS:90}
  edit-lock:
    heartbeat-seconds: ${SOCLE_EDIT_LOCK_HEARTBEAT_SECONDS:15}
    ttl-seconds: ${SOCLE_EDIT_LOCK_TTL_SECONDS:45}
  identity:
    # Défauts = comportement Keycloak historique (dev example). Voir docs/identity-providers.md.
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/socle}
    subject-claim: sub
    email-claim: email
    name-claim: name
    roles-claim: realm_access.roles
    role-source: CLAIMS
    default-role: CONTRIBUTEUR
    role-mapping:
      contributeur: CONTRIBUTEUR
      auditeur: AUDITEUR
      integrateur: INTEGRATEUR
      administrateur-systeme: ADMINISTRATEUR_SYSTEME
    bootstrap-admin-subjects: []
    link-by-verified-email: false
    client-id: ${OIDC_FRONTEND_CLIENT_ID:socle-frontend}
    scopes:
      - openid
      - profile
      - email

logging:
  level:
    root: INFO
    eu.socle: DEBUG
