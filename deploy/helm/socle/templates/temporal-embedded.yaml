{{- if eq .Values.temporal.mode "embedded" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "socle.fullname" . }}-temporal
  labels:
    {{- include "socle.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
spec:
  selector:
    app.kubernetes.io/component: temporal
    {{- include "socle.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "socle.fullname" . }}-temporal
  labels:
    {{- include "socle.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: temporal
      {{- include "socle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: temporal
        {{- include "socle.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: schema
          image: {{ .Values.temporal.embedded.image.adminTools }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eux
              EP={{ include "socle.postgres.host" . }}
              PORT={{ .Values.postgres.port }}
              USER={{ .Values.postgres.username }}
              for i in $(seq 1 60); do
                if pg_isready -h "$EP" -p "$PORT" -U "$USER" -d temporal_visibility >/dev/null 2>&1; then
                  break
                fi
                if [ "$i" -ge 60 ]; then
                  echo "postgres temporal_visibility not ready" >&2
                  exit 1
                fi
                sleep 2
              done
              temporal-sql-tool --plugin postgres12 --ep "$EP" -p "$PORT" \
                -u "$USER" --pw "$POSTGRES_PASSWORD" --db temporal setup-schema -v 0.0 || true
              temporal-sql-tool --plugin postgres12 --ep "$EP" -p "$PORT" \
                -u "$USER" --pw "$POSTGRES_PASSWORD" --db temporal \
                update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
              temporal-sql-tool --plugin postgres12 --ep "$EP" -p "$PORT" \
                -u "$USER" --pw "$POSTGRES_PASSWORD" --db temporal_visibility setup-schema -v 0.0 || true
              temporal-sql-tool --plugin postgres12 --ep "$EP" -p "$PORT" \
                -u "$USER" --pw "$POSTGRES_PASSWORD" --db temporal_visibility \
                update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "socle.secretName" . }}
                  key: SPRING_DATASOURCE_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: temporal
          image: {{ .Values.temporal.embedded.image.server }}
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "socle.secretName" . }}
                  key: SPRING_DATASOURCE_PASSWORD
            - name: POSTGRES_SEEDS
              value: {{ include "socle.postgres.host" . | quote }}
            - name: DBNAME
              value: temporal
            - name: VISIBILITY_DBNAME
              value: temporal_visibility
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: config/dynamicconfig/docker.yaml
            - name: BIND_ON_IP
              value: 0.0.0.0
          ports:
            - containerPort: 7233
              name: grpc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 10
{{- end }}
