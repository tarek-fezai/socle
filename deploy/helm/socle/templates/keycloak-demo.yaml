{{- if .Values.demoIdp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "socle.fullname" . }}-keycloak
  labels:
    {{- include "socle.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  selector:
    app.kubernetes.io/component: keycloak
    {{- include "socle.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.demoIdp.httpPort }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "socle.fullname" . }}-keycloak
  labels:
    {{- include "socle.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: keycloak
      {{- include "socle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: keycloak
        {{- include "socle.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: {{ .Values.demoIdp.image }}
          args: ["start-dev", "--http-enabled=true", "--hostname-strict=false"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ required "demoIdp.adminUser required" .Values.demoIdp.adminUser | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: {{ required "demoIdp.adminPassword required when demoIdp.enabled" .Values.demoIdp.adminPassword | quote }}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: {{ printf "jdbc:postgresql://%s:%d/keycloak" (include "socle.postgres.host" .) (int .Values.postgres.port) | quote }}
            - name: KC_DB_USERNAME
              value: {{ .Values.postgres.username | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "socle.secretName" . }}
                  key: SPRING_DATASOURCE_PASSWORD
            - name: KC_HTTP_PORT
              value: {{ .Values.demoIdp.httpPort | quote }}
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: {{ .Values.demoIdp.httpPort }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            # start-dev: management health may be on :9000; realm endpoint is enough for CI smoke.
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
{{- end }}
