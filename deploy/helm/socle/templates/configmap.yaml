apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "socle.fullname" . }}-config
  labels:
    {{- include "socle.labels" . | nindent 4 }}
data:
  SOCLE_STORAGE_PROVIDER: {{ .Values.storage.provider | quote }}
  SOCLE_STORAGE_GIT_PATH: {{ .Values.storage.git.mountPath | quote }}
  SOCLE_BLOB_PROVIDER: {{ default "local" .Values.blob.provider | quote }}
  {{- if eq (default "local" .Values.blob.provider) "local" }}
  SOCLE_BLOB_LOCAL_DIR: {{ .Values.blob.local.mountPath | quote }}
  {{- end }}
  {{- if eq (default "local" .Values.blob.provider) "s3" }}
  SOCLE_BLOB_S3_ENDPOINT: {{ required "blob.s3.endpoint is required when blob.provider=s3" .Values.blob.s3.endpoint | quote }}
  SOCLE_BLOB_S3_REGION: {{ .Values.blob.s3.region | quote }}
  SOCLE_BLOB_S3_BUCKET: {{ required "blob.s3.bucket is required when blob.provider=s3" .Values.blob.s3.bucket | quote }}
  SOCLE_BLOB_S3_PATH_STYLE: {{ .Values.blob.s3.pathStyle | quote }}
  SOCLE_BLOB_S3_SSE: {{ .Values.blob.s3.serverSideEncryption | quote }}
  {{- end }}
  SOCLE_ATTACHMENT_MAX_MB: {{ .Values.attachment.maxMb | default 25 | quote }}
  SOCLE_ATTACHMENT_ORPHAN_RETENTION_DAYS: {{ .Values.attachment.orphanRetentionDays | default 7 | quote }}
  OPENFGA_API_URL: {{ if eq .Values.openfga.mode "embedded" }}{{ printf "http://%s-openfga:8080" (include "socle.fullname" .) | quote }}{{ else }}{{ .Values.openfga.external.apiUrl | quote }}{{ end }}
  OPENFGA_STORE_ID: {{ .Values.openfga.external.storeId | quote }}
  OPENFGA_MODEL_ID: {{ .Values.openfga.external.modelId | quote }}
  OPENFGA_AUTO_INIT: {{ .Values.openfga.autoInit | default true | quote }}
  OPENFGA_STATE_DIR: {{ .Values.openfga.stateDir | default "/openfga-config" | quote }}
  SOCLE_REJECT_WEAK_SECRETS: "true"
  TEMPORAL_TARGET: {{ if eq .Values.temporal.mode "embedded" }}{{ printf "%s-temporal:7233" (include "socle.fullname" .) | quote }}{{ else }}{{ .Values.temporal.external.target | quote }}{{ end }}
  TEMPORAL_NAMESPACE: {{ .Values.temporal.external.namespace | quote }}
  OIDC_ISSUER_URI: {{ required "idp.issuerUri is required" .Values.idp.issuerUri | quote }}
  {{- if .Values.idp.clientIssuerUri }}
  OIDC_CLIENT_ISSUER_URI: {{ .Values.idp.clientIssuerUri | quote }}
  {{- end }}
  OIDC_JWK_SET_URI: {{ .Values.idp.jwkSetUri | quote }}
  OIDC_CLIENT_ID: {{ .Values.idp.clientId | quote }}
  OIDC_FRONTEND_CLIENT_ID: {{ .Values.idp.frontendClientId | quote }}
  SPRING_DATASOURCE_URL: {{ printf "jdbc:postgresql://%s:%d/%s" (include "socle.postgres.host" .) (int .Values.postgres.port) .Values.postgres.database | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgres.username | quote }}
  SOCLE_IDENTITY_ROLE_SOURCE: {{ .Values.idp.roleSource | default "CLAIMS" | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.idp.corsAllowedOrigins | default "*" | quote }}
