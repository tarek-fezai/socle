{{- if eq .Values.temporal.mode "embedded" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "socle.fullname" . }}-temporal-namespace
  labels:
    {{- include "socle.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: namespace
          image: {{ .Values.temporal.embedded.image.adminTools }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eux
              ADDR={{ include "socle.fullname" . }}-temporal:7233
              NS={{ .Values.temporal.external.namespace | default "default" }}
              for i in $(seq 1 90); do
                temporal operator cluster health --address "$ADDR" >/dev/null 2>&1 && break
                sleep 2
              done
              temporal operator namespace describe --namespace "$NS" --address "$ADDR" \
                || temporal operator namespace create --namespace "$NS" --address "$ADDR"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
{{- end }}
