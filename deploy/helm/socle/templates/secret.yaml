{{- if not .Values.backend.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "socle.fullname" . }}-secrets
  labels:
    {{- include "socle.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ required "secrets.postgresPassword or existingSecret required" .Values.secrets.postgresPassword | quote }}
  OIDC_CLIENT_SECRET: {{ required "secrets.oidcClientSecret or existingSecret required" .Values.secrets.oidcClientSecret | quote }}
  {{- $patPepper := required "secrets.patPepper or existingSecret required (SOCLE_PAT_PEPPER, ≥ 32 octets)" .Values.secrets.patPepper }}
  {{- if and $patPepper (lt (len $patPepper) 32) }}
  {{- fail "secrets.patPepper trop court : SOCLE_PAT_PEPPER exige ≥ 32 octets" }}
  {{- end }}
  SOCLE_PAT_PEPPER: {{ $patPepper | quote }}
  {{- $invitePepper := required "secrets.invitePepper or existingSecret required (SOCLE_INVITE_PEPPER, ≥ 32 octets)" .Values.secrets.invitePepper }}
  {{- if and $invitePepper (lt (len $invitePepper) 32) }}
  {{- fail "secrets.invitePepper trop court : SOCLE_INVITE_PEPPER exige ≥ 32 octets" }}
  {{- end }}
  SOCLE_INVITE_PEPPER: {{ $invitePepper | quote }}
  {{- if .Values.secrets.smtpUsername }}
  SOCLE_SMTP_USERNAME: {{ .Values.secrets.smtpUsername | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpPassword }}
  SOCLE_SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  {{- end }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=disable" .Values.postgres.username .Values.secrets.postgresPassword (include "socle.postgres.host" .) (int .Values.postgres.port) .Values.postgres.database | quote }}
  OPENFGA_DATASTORE_URI: {{ printf "postgres://%s:%s@%s:%d/openfga?sslmode=disable" .Values.postgres.username .Values.secrets.postgresPassword (include "socle.postgres.host" .) (int .Values.postgres.port) | quote }}
{{- end }}
